<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
    }

    /* --- GRID --- */
    #grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      height: 100vh;
      gap: 2px;
      padding: 2px;
    }

    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.9),
        inset 0 -1px 1px rgba(0, 0, 0, 0.04),
        0 4px 24px rgba(0, 0, 0, 0.08);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .tile::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.6), transparent);
      pointer-events: none;
      border-radius: 4px 4px 0 0;
    }

    .tile:hover {
      background: rgba(255, 255, 255, 0.65);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 1),
        inset 0 -1px 1px rgba(0, 0, 0, 0.05),
        0 8px 32px rgba(0, 0, 0, 0.12);
    }

    .tile-inner {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .tile-logo {
      max-width: 200px;
      max-height: 130px;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
    }

    .tile-label {
      color: #111;
      font-size: clamp(1.1rem, 2.5vw, 2rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      padding: 0.5rem 1rem;
      transition: letter-spacing 0.3s ease;
    }

    .tile:hover .tile-label { letter-spacing: 0.2em; }

    /* --- POP-UP WINDOW --- */
    .popup {
      position: fixed;
      z-index: 100;
      width: calc(100vw / 2);
      height: calc(100vh / 2);
      min-width: 320px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 2px solid #000080;
      box-shadow: 4px 4px 0 #000, 6px 6px 0 rgba(0,0,0,0.2);
      border-radius: 3px;
      animation: popIn 0.18s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      cursor: default;
      user-select: none;
      overflow: hidden;
    }

    .popup.closing {
      animation: popOut 0.15s ease-in forwards;
    }

    @keyframes popIn {
      from { transform: scale(0.7) rotate(var(--tilt)); opacity: 0; }
      to   { transform: scale(1) rotate(var(--tilt)); opacity: 1; }
    }

    @keyframes popOut {
      from { transform: scale(1) rotate(var(--tilt)); opacity: 1; }
      to   { transform: scale(0.6) rotate(var(--tilt)); opacity: 0; }
    }

    /* Title bar */
    .popup-titlebar {
      background: linear-gradient(to right, #000080, #1084d0);
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: move;
    }

    .popup-title {
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      margin-right: 0.5rem;
    }

    .popup-controls {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .popup-btn {
      width: 28px;
      height: 24px;
      font-size: 0.9rem;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.4);
      border-bottom-color: rgba(0,0,0,0.4);
      border-right-color: rgba(0,0,0,0.4);
      background: #c0c0c0;
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      padding-bottom: 1px;
    }

    .popup-btn:hover { background: #d8d8d8; }
    .popup-btn.close-btn { background: #c0c0c0; }
    .popup-btn.close-btn:hover { background: #ff4444; color: #fff; }

    /* Photo area */
    .popup-photo {
      width: 100%;
      flex: 1;
      background: #1a1a2e;
      position: relative;
      overflow: hidden;
    }

    .popup-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .popup-photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      color: rgba(255,255,255,0.3);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border: 2px dashed rgba(255,255,255,0.15);
    }

    /* Content */
    .popup-body {
      padding: 0.7rem 1rem;
      border-top: 1px solid #ddd;
      overflow: hidden;
      flex-shrink: 0;
    }

    .popup-label {
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 0.5rem;
    }

    .popup-text {
      font-size: 1rem;
      color: #222;
      line-height: 1.6;
    }

    .popup-footer {
      padding: 0.6rem 1.2rem;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f5f5f5;
    }

    .popup-counter {
      font-size: 0.7rem;
      color: #999;
      letter-spacing: 0.05em;
    }

    .popup-next-btn {
      font-size: 0.72rem;
      font-weight: bold;
      color: #000080;
      background: none;
      border: none;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-decoration: underline;
    }

    .popup-next-btn:hover { color: #1084d0; }

    /* Dim overlay */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.08);
      z-index: 90;
      display: none;
    }

    #overlay.active { display: block; }
  </style>
</head>
<body>

  <!-- HOME GRID -->
  <div id="grid">
    <div class="tile" data-role="maitre">
      <div class="tile-inner">
        <img class="tile-logo" src="https://i.imgur.com/yE5j1hd.jpg" alt="Happier">
        <div class="tile-label">Maître D' & Events Producer</div>
      </div>
    </div>
    <div class="tile" data-role="manager">
      <div class="tile-inner">
        <img class="tile-logo" src="https://i.imgur.com/LOqPyMn.jpg" alt="Lock Stock Bar & Grill">
        <div class="tile-label">Floor & Closing Manager</div>
      </div>
    </div>
    <div class="tile" data-role="marketing">
      <div class="tile-inner">
        <img class="tile-logo" src="https://i.imgur.com/GJMovjs.jpg" alt="Kepler">
        <div class="tile-label">Digital Marketing Analyst</div>
      </div>
    </div>
    <div class="tile" data-role="digital">
      <div class="tile-inner">
        <img class="tile-logo" src="https://i.imgur.com/3EdnKkj.jpg" alt="New Blue Interactive">
        <div class="tile-label">Digital Strategy Assistant</div>
      </div>
    </div>
  </div>

  <div id="overlay"></div>

  <script>
    const roles = {
      maitre: {
        title: "Maître D' & Events Producer",
        color: "#1a1a2e",
        slides: [
          { label: "The Role", text: "Front-of-house lead and events producer at Happier New York — a members-only wellness concept in Manhattan. Every shift started before the first guest arrived and ended long after the last one left.", photo: null },
          { label: "Running the Room", text: "Led a team of 5 FOH staff through full-day service — managing the floor, supporting the host stand, and making real-time seating calls to keep the guest experience seamless from open to close.", photo: null },
          { label: "Guest Relationships", text: "Served as the primary point of contact for members and regulars. Building relationships was the job — knowing names, preferences, and handling anything that went sideways with composure.", photo: null },
          { label: "Events", text: "Managed private event inquiries end-to-end across multiple properties — from first inquiry through day-of execution, coordinating with HR, Facilities, and Communications to pull it all together.", photo: null },
          { label: "Tools of the Trade", text: "Resy, OpenTable, and Toast POS daily. Ran staff training programs and performance reviews. Equal parts hospitality, logistics, and people management.", photo: null }
        ]
      },
      manager: {
        title: "Floor & Closing Manager",
        color: "#16213e",
        slides: [
          { label: "The Role", text: "Floor and closing manager at Lock Stock Bar & Grill in Bristol, NY — a high-volume spot running lunch, dinner, and late-night. Fast pace, full house, no shortcuts.", photo: null },
          { label: "Owning the Shift", text: "Kept service flowing across all dayparts — lunch rushes, dinner covers, late-night crowds. Standards stayed consistent regardless of volume. That was the job.", photo: null },
          { label: "Closing the Night", text: "Every close meant financial reports, scheduling reviews, facilities checks, and Health Department compliance walk-throughs. The shift wasn't done until everything was signed off.", photo: null },
          { label: "The Team", text: "Cross-trained staff across every FOH role and ran ongoing coaching throughout each shift. Built a team that could adapt on the fly — which mattered a lot when COVID hit.", photo: null },
          { label: "COVID Pivot", text: "Led the operational restructuring when the restaurant reopened — rewrote SOPs, retrained the full FOH team, and maintained service quality through every phase of reopening.", photo: null }
        ]
      },
      marketing: {
        title: "Digital Marketing Analyst",
        color: "#0f3460",
        slides: [
          { label: "The Role", text: "Optimization & Innovation analyst at Kepler in New York — a data-driven performance marketing agency. Part campaign management, part data science, part strategy.", photo: null },
          { label: "The Budget", text: "Purchased ad inventory across 6 social media platforms inside a $250K monthly client budget. Every dollar had to work. Allocation decisions were backed by data, not gut.", photo: null },
          { label: "Reading the Data", text: "Pulled insights from 5 years of campaign performance data to identify brand marketing trends — then translated those findings into concrete optimization moves for active campaigns.", photo: null },
          { label: "Day-to-Day", text: "Daily check-ins with the team, ongoing campaign adjustments, and regular presentations of performance data. The job was as much communication as it was analysis.", photo: null },
          { label: "Platforms", text: "Worked across Meta, Pinterest, TikTok, Snapchat, Twitter/X, and LinkedIn. Each platform had its own logic — different creative formats, audiences, and optimization levers.", photo: null }
        ]
      },
      digital: {
        title: "Digital Strategy Assistant",
        color: "#533483",
        slides: [
          { label: "The Role", text: "Digital Strategy Assistant at New Blue Interactive in the DC-Baltimore area — a political digital agency running fundraising and communications for local and state campaigns.", photo: null },
          { label: "The Stakes", text: "Supported million-dollar digital fundraising campaigns for real elections. Every email, every ask, every subject line mattered — campaigns live or die on their fundraising numbers.", photo: null },
          { label: "Writing & Testing", text: "Drafted fundraising emails and ran A/B tests on tone, subject lines, and ask amounts — informed by years of performance data and a deep understanding of what moves donors to act.", photo: null },
          { label: "Scale & QA", text: "Ran quality assurance on marketing materials going to email lists of 100,000+. One broken link or rendering error at that scale is a real problem — nothing shipped without sign-off.", photo: null },
          { label: "Technical + Creative", text: "Built emails in HTML and CSS for CRM deployment, and handled all creative production in Adobe Photoshop and Illustrator. Both sides of the work lived in the same role.", photo: null }
        ]
      }
    };

    const overlay = document.getElementById('overlay');
    let currentPopup = null;
    let currentRole = null;
    let currentSlideIndex = 0;

    const tilts = [-2.5, 1.8, -1.2, 2.1, -0.8, 1.5, -1.9, 2.4];
    let tiltIndex = 0;

    function clampPos(x, y, w, h) {
      const pad = 20;
      return {
        x: Math.max(pad, Math.min(x, window.innerWidth - w - pad)),
        y: Math.max(pad, Math.min(y, window.innerHeight - h - pad))
      };
    }

    function randomPos(w, h) {
      const pad = 40;
      return {
        x: pad + Math.random() * Math.max(0, window.innerWidth - w - pad * 2),
        y: pad + Math.random() * Math.max(0, window.innerHeight - h - pad * 2)
      };
    }

    function nearbyPos(fromX, fromY, w, h) {
      // Offset by a small random nudge from the previous popup's position
      const nudge = 30 + Math.random() * 60;
      const angle = Math.random() * Math.PI * 2;
      const x = fromX + Math.cos(angle) * nudge;
      const y = fromY + Math.sin(angle) * nudge;
      return clampPos(x, y, w, h);
    }

    function openSlide(roleKey, slideIndex, fromPos) {
      const role = roles[roleKey];
      const slide = role.slides[slideIndex];
      const isLast = slideIndex === role.slides.length - 1;

      currentRole = roleKey;
      currentSlideIndex = slideIndex;

      const tilt = tilts[tiltIndex % tilts.length];
      tiltIndex++;

      const popup = document.createElement('div');
      popup.className = 'popup';
      popup.style.setProperty('--tilt', tilt + 'deg');

      // Temporarily place off-screen to measure size
      popup.style.visibility = 'hidden';
      popup.style.left = '-9999px';
      popup.style.top = '0';

      // Build HTML
      popup.innerHTML = `
        <div class="popup-titlebar" data-drag>
          <div class="popup-title">${role.title}</div>
          <div class="popup-controls">
            <button class="popup-btn">_</button>
            <button class="popup-btn">□</button>
            <button class="popup-btn close-btn" id="popup-close">✕</button>
          </div>
        </div>
        <div class="popup-photo" style="background:${role.color}">
          ${slide.photo
            ? `<img src="${slide.photo}" alt="${slide.label}">`
            : `<div class="popup-photo-placeholder">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
                Add photo
              </div>`
          }
        </div>
        <div class="popup-body">
          <div class="popup-label">${slide.label}</div>
          <div class="popup-text">${slide.text}</div>
        </div>
        <div class="popup-footer">
          <span class="popup-counter">${slideIndex + 1} of ${role.slides.length}</span>
          ${!isLast ? `<button class="popup-next-btn" id="popup-next">Next →</button>` : `<span class="popup-counter" style="color:#888">End of story</span>`}
        </div>
      `;

      document.body.appendChild(popup);

      // Position after render
      requestAnimationFrame(() => {
        const w = popup.offsetWidth;
        const h = popup.offsetHeight;
        const pos = fromPos ? nearbyPos(fromPos.x, fromPos.y, w, h) : randomPos(w, h);
        popup.style.left = pos.x + 'px';
        popup.style.top = pos.y + 'px';
        popup.style.visibility = 'visible';
        popup._pos = pos; // store for next popup
      });

      // Close button — X advances to next slide (near same position)
      popup.querySelector('#popup-close').addEventListener('click', () => {
        dismissPopup(popup, roleKey, slideIndex, !isLast);
      });

      // Next button
      const nextBtn = popup.querySelector('#popup-next');
      if (nextBtn) {
        nextBtn.addEventListener('click', () => {
          dismissPopup(popup, roleKey, slideIndex, true);
        });
      }

      // Draggable
      makeDraggable(popup, popup.querySelector('[data-drag]'));

      // Dim overlay
      overlay.classList.add('active');

      currentPopup = popup;
    }

    function dismissPopup(popup, roleKey, slideIndex, goNext) {
      const savedPos = popup._pos || { x: parseInt(popup.style.left) || 0, y: parseInt(popup.style.top) || 0 };
      popup.classList.add('closing');
      popup.addEventListener('animationend', () => {
        popup.remove();
        const role = roles[roleKey];
        if (goNext && slideIndex + 1 < role.slides.length) {
          setTimeout(() => openSlide(roleKey, slideIndex + 1, savedPos), 80);
        } else {
          overlay.classList.remove('active');
          currentPopup = null;
        }
      }, { once: true });
    }

    // Click X → open next slide (cascade like real pop-ups)
    function makeDraggable(popup, handle) {
      let ox = 0, oy = 0, startX = 0, startY = 0, dragging = false;

      handle.addEventListener('mousedown', e => {
        if (e.target.classList.contains('popup-btn')) return;
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        ox = parseInt(popup.style.left) || 0;
        oy = parseInt(popup.style.top) || 0;
        e.preventDefault();
      });

      document.addEventListener('mousemove', e => {
        if (!dragging) return;
        popup.style.left = (ox + e.clientX - startX) + 'px';
        popup.style.top  = (oy + e.clientY - startY) + 'px';
      });

      document.addEventListener('mouseup', () => { dragging = false; });
    }

    document.querySelectorAll('.tile').forEach(tile => {
      tile.addEventListener('click', () => {
        // If a popup is open, close it first
        if (currentPopup) {
          currentPopup.remove();
          currentPopup = null;
        }
        tiltIndex = 0;
        openSlide(tile.dataset.role, 0);
      });
    });

    // Dismiss on overlay click
    overlay.addEventListener('click', e => {
      if (e.target === overlay && currentPopup) {
        dismissPopup(currentPopup, currentRole, currentSlideIndex, false);
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && currentPopup) {
        dismissPopup(currentPopup, currentRole, currentSlideIndex, false);
      }
    });
  </script>
</body>
</html>
