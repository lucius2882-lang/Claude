<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lucius Campany</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
    }

    /* --- SPLASH PAGE --- */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.7s ease;
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }

    .splash-name {
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 200;
      letter-spacing: 0.18em;
      color: #ffffff;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(18px);
      animation: splash-rise 1s ease 0.3s forwards;
    }
    .splash-rule {
      width: 60px;
      height: 1px;
      background: rgba(255,255,255,0.35);
      margin: 22px auto;
      opacity: 0;
      animation: splash-rise 1s ease 0.6s forwards;
    }
    .splash-title {
      font-size: clamp(0.75rem, 2vw, 1rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(10px);
      animation: splash-rise 1s ease 0.8s forwards;
    }
    .splash-enter {
      position: absolute;
      bottom: 40px;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: rgba(255,255,255,0.25);
      text-transform: uppercase;
      opacity: 0;
      animation: splash-rise 1s ease 1.4s forwards, splash-pulse 3s ease 2.4s infinite;
    }
    @keyframes splash-rise {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes splash-pulse {
      0%, 100% { opacity: 0.25; } 50% { opacity: 0.55; }
    }

    /* --- GRID --- */
    #grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      height: 100vh;
      gap: 2px;
      padding: 2px;
    }

    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.9),
        inset 0 -1px 1px rgba(0, 0, 0, 0.04),
        0 4px 24px rgba(0, 0, 0, 0.08);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .tile::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.6), transparent);
      pointer-events: none;
      border-radius: 4px 4px 0 0;
    }

    .tile:hover {
      background: rgba(255, 255, 255, 0.65);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 1),
        inset 0 -1px 1px rgba(0, 0, 0, 0.05),
        0 8px 32px rgba(0, 0, 0, 0.12);
    }

    .tile-inner {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .tile-logo {
      max-width: 200px;
      max-height: 130px;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
    }

    .tile-label {
      color: #111;
      font-size: clamp(1.1rem, 2.5vw, 2rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      padding: 0.5rem 1rem;
      transition: letter-spacing 0.3s ease;
    }

    .tile:hover .tile-label { letter-spacing: 0.2em; }

    /* --- FULL-SCREEN DETAIL PANEL (non-Kepler) --- */
    #detail {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.4s ease;
      overflow-y: auto;
      z-index: 50;
    }

    #detail.visible {
      display: flex;
      opacity: 1;
    }

    .detail-header {
      padding: 3rem 4rem 2rem;
      color: #fff;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      flex-shrink: 0;
    }

    .detail-title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #close-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.6rem 1.4rem;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.2s;
    }

    #close-btn:hover { background: rgba(255,255,255,0.3); }

    .detail-body {
      background: #f9f9f9;
      flex: 1;
      padding: 3rem 4rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
    }

    @media (max-width: 700px) {
      .detail-body { grid-template-columns: 1fr; padding: 2rem; }
      .detail-header { padding: 2rem; }
    }

    .detail-section h3 {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #ddd;
    }

    .detail-section p {
      font-size: 0.95rem;
      color: #333;
      line-height: 1.7;
    }

    /* --- KEPLER POP-UP --- */
    .popup {
      position: fixed;
      z-index: 100;
      width: calc(100vw / 2);
      height: calc(100vh / 2);
      min-width: 320px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 2px solid #000080;
      box-shadow: 4px 4px 0 #000, 6px 6px 0 rgba(0,0,0,0.2);
      border-radius: 3px;
      animation: popIn 0.18s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      cursor: default;
      user-select: none;
      overflow: hidden;
    }

    .popup.closing {
      animation: popOut 0.15s ease-in forwards;
    }

    @keyframes popIn {
      from { transform: scale(0.7) rotate(var(--tilt)); opacity: 0; }
      to   { transform: scale(1) rotate(var(--tilt)); opacity: 1; }
    }

    @keyframes popOut {
      from { transform: scale(1) rotate(var(--tilt)); opacity: 1; }
      to   { transform: scale(0.6) rotate(var(--tilt)); opacity: 0; }
    }

    .popup-titlebar {
      background: linear-gradient(to right, #000080, #1084d0);
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: move;
      flex-shrink: 0;
    }

    .popup-title {
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      margin-right: 0.5rem;
    }

    .popup-controls {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .popup-btn {
      width: 28px;
      height: 24px;
      font-size: 0.9rem;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.4);
      border-bottom-color: rgba(0,0,0,0.4);
      border-right-color: rgba(0,0,0,0.4);
      background: #c0c0c0;
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      padding-bottom: 1px;
    }

    .popup-btn:hover { background: #d8d8d8; }
    .popup-btn.close-btn:hover { background: #ff4444; color: #fff; }

    .popup-photo {
      width: 100%;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .popup-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .popup-photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      color: rgba(255,255,255,0.3);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border: 2px dashed rgba(255,255,255,0.15);
    }

    .popup-body {
      padding: 0.7rem 1rem;
      border-top: 1px solid #ddd;
      overflow: hidden;
      flex-shrink: 0;
    }

    .popup-label {
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 0.5rem;
    }

    .popup-text {
      font-size: 1rem;
      color: #222;
      line-height: 1.6;
    }

    .popup-footer {
      padding: 0.6rem 1.2rem;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f5f5f5;
      flex-shrink: 0;
    }

    .popup-counter {
      font-size: 0.7rem;
      color: #999;
      letter-spacing: 0.05em;
    }

    .popup-next-btn {
      font-size: 0.72rem;
      font-weight: bold;
      color: #000080;
      background: none;
      border: none;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-decoration: underline;
    }
    .popup-next-btn:hover { color: #1084d0; }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.08);
      z-index: 90;
      display: none;
    }
    #overlay.active { display: block; }

    /* --- RESERVATION BOOK (Happier) --- */
    #bookview {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      flex-direction: column;
      background: #111;
      font-family: 'Segoe UI', sans-serif;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #bookview.visible { display: flex; opacity: 1; }

    .bk-topbar {
      background: #111;
      border-bottom: 2px solid #c8a96e;
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .bk-title {
      font-size: 1rem;
      font-weight: 600;
      color: #c8a96e;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .bk-date { font-size: 0.8rem; color: #666; margin-top: 3px; }
    .bk-close {
      background: none;
      border: 1px solid #333;
      color: #888;
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .bk-close:hover { border-color: #c8a96e; color: #c8a96e; }

    .bk-resv-panel {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .bk-shift-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c8a96e;
      margin: 24px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #222;
    }
    .bk-shift-label:first-child { margin-top: 0; }

    .bk-resv-row {
      display: grid;
      grid-template-columns: 80px 1fr;
      align-items: center;
      gap: 16px;
      padding: 12px 14px;
      border-radius: 6px;
      margin-bottom: 3px;
      border-left: 3px solid transparent;
      transition: background 0.15s;
    }
    .bk-resv-row.clickable { cursor: pointer; }
    .bk-resv-row.clickable:hover { background: rgba(200,169,110,0.07); }
    .bk-resv-row.seated   { border-left-color: #34A853; }
    .bk-resv-row.arrived  { border-left-color: #FBBC05; }
    .bk-resv-row.reserved { border-left-color: #4285F4; }
    .bk-resv-row.completed{ border-left-color: #333; opacity: 0.45; }
    .bk-resv-row.vip      { border-left-color: #c8a96e; }

    .bk-time {
      font-size: 0.82rem;
      color: #c8a96e;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .bk-guest { font-size: 0.9rem; color: #e0d8c8; font-weight: 500; }
    .bk-note  { font-size: 0.75rem; color: #666; margin-top: 2px; }

    .resv-popup {
      border-color: #c8a96e;
      box-shadow: 0 0 0 1px #2a2a2a, 6px 6px 32px rgba(0,0,0,0.6);
    }

    @media (max-width: 600px) {
      .bk-topbar { padding: 0 16px; }
      .bk-resv-panel { padding: 16px; }
      .bk-resv-row { grid-template-columns: 70px 1fr; gap: 10px; }
    }

    /* --- BAR MENU (Lock Stock) — Physical Book --- */
    /* Colors from logo: brown #5c2d0c, gold #e8a820, navy #1a4a8a, sky #4a9fd4, orange #e85a20 */
    #barmenu {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(20, 10, 4, 0.88);
      opacity: 0;
      transition: opacity 0.3s ease;
      font-family: Georgia, 'Times New Roman', serif;
      padding: 20px;
    }
    #barmenu.visible { display: flex; opacity: 1; }

    .bm-close-x {
      position: fixed;
      top: 18px; right: 22px;
      background: rgba(92,45,12,0.8);
      border: 1px solid #e8a820;
      color: #e8a820;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      padding: 6px 14px;
      cursor: pointer;
      font-family: 'Segoe UI', sans-serif;
      border-radius: 3px;
      z-index: 10;
      transition: all 0.15s;
    }
    .bm-close-x:hover { background: #5c2d0c; color: #fff; }

    .bm-book {
      width: min(92vw, 760px);
      height: min(82vh, 510px);
      display: flex;
      flex-direction: column;
      border-radius: 0;
      /* Spine on left, page stack on right */
      border-left: 7px solid #1a0800;
      border-right: 3px solid #3a1a05;
      border-top: 3px solid #3a1a05;
      border-bottom: 3px solid #3a1a05;
      box-shadow:
        /* Page-edge stack illusion */
        3px 0 0 #e4d5b8,
        5px 0 0 #d8c9ac,
        7px 0 0 #cbbea0,
        /* Drop shadow */
        10px 12px 50px rgba(0,0,0,0.75),
        0 6px 20px rgba(0,0,0,0.5);
      overflow: hidden;
      position: relative;
    }
    /* Spine highlight */
    .bm-book::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(to right, rgba(255,255,255,0.08), transparent);
      z-index: 10;
      pointer-events: none;
    }

    .bm-spread-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
      perspective: 1600px;
      perspective-origin: center center;
    }

    .bm-spread {
      display: flex;
      height: 100%;
    }

    /* 3D page flip animations */
    @keyframes bm-flip-out-next {
      0%   { transform: rotateY(0deg) scale(1);    opacity: 1; }
      60%  { opacity: 0.3; }
      100% { transform: rotateY(-82deg) scale(0.96); opacity: 0; }
    }
    @keyframes bm-flip-in-next {
      0%   { transform: rotateY(82deg) scale(0.96); opacity: 0; }
      40%  { opacity: 0.3; }
      100% { transform: rotateY(0deg) scale(1);    opacity: 1; }
    }
    @keyframes bm-flip-out-prev {
      0%   { transform: rotateY(0deg) scale(1);    opacity: 1; }
      60%  { opacity: 0.3; }
      100% { transform: rotateY(82deg) scale(0.96); opacity: 0; }
    }
    @keyframes bm-flip-in-prev {
      0%   { transform: rotateY(-82deg) scale(0.96); opacity: 0; }
      40%  { opacity: 0.3; }
      100% { transform: rotateY(0deg) scale(1);    opacity: 1; }
    }
    .bm-spread.fold-out-next { animation: bm-flip-out-next 0.22s ease-in  forwards; }
    .bm-spread.fold-in-next  { animation: bm-flip-in-next  0.26s ease-out forwards; }
    .bm-spread.fold-out-prev { animation: bm-flip-out-prev 0.22s ease-in  forwards; }
    .bm-spread.fold-in-prev  { animation: bm-flip-in-prev  0.26s ease-out forwards; }

    /* Cover */
    .bm-cover {
      width: 100%;
      flex-shrink: 0;
      background: linear-gradient(160deg, #5c2d0c 0%, #3a1a05 40%, #1a0a02 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
      height: 100%;
      cursor: pointer;
    }
    /* Sunset stripe accent at top */
    .bm-cover::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(to right, #e85a20, #e8a820, #1a4a8a, #4a9fd4);
    }
    /* Inner border */
    .bm-cover::after {
      content: '';
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(232,168,32,0.3);
      pointer-events: none;
    }
    .bm-cover-name {
      font-size: clamp(1.5rem, 4.5vw, 2.8rem);
      color: #e8a820;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      line-height: 1.25;
      margin-bottom: 10px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .bm-cover-rule {
      width: 100px; height: 2px;
      background: linear-gradient(to right, transparent, #e8a820, transparent);
      margin: 14px auto;
    }
    .bm-cover-sub {
      font-size: 0.72rem;
      color: rgba(232,168,32,0.6);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-family: 'Segoe UI', sans-serif;
      margin-bottom: 3px;
    }
    .bm-cover-tag {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.5);
      font-style: italic;
      margin-top: 16px;
    }
    .bm-cover-tap {
      margin-top: 28px;
      font-size: 0.72rem;
      color: rgba(232,168,32,0.7);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-family: 'Segoe UI', sans-serif;
      animation: pulse 2s ease-in-out infinite;
      border: 1px solid rgba(232,168,32,0.3);
      padding: 8px 20px;
      border-radius: 2px;
    }
    @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

    /* Content pages — lighter, warm white */
    .bm-pages {
      width: 100%;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #fdf8f0;
      height: 100%;
      overflow-y: auto;
      position: relative;
    }
    .bm-pages::after {
      content: '';
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, #e8a820 0%, rgba(92,45,12,0.15) 20%, rgba(92,45,12,0.15) 80%, #e8a820 100%);
      pointer-events: none;
    }

    .bm-page {
      padding: 24px 22px;
      background: #fdf8f0;
    }
    .bm-page:first-child { background: linear-gradient(to right, #f8f2e6, #fdf8f0); }
    .bm-page:last-child  { background: linear-gradient(to left,  #f8f2e6, #fdf8f0); }

    .bm-page-title {
      font-size: 0.62rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #5c2d0c;
      font-family: 'Segoe UI', sans-serif;
      font-weight: 700;
      text-align: center;
      margin-bottom: 3px;
    }
    .bm-page-orn {
      text-align: center;
      color: #e8a820;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      margin-bottom: 10px;
    }

    /* Page image slot */
    .bm-page-img {
      width: 100%;
      height: 88px;
      background: rgba(92,45,12,0.06);
      border: 1.5px dashed rgba(92,45,12,0.22);
      border-radius: 3px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }
    .bm-page-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .bm-page-img-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: rgba(92,45,12,0.3);
      pointer-events: none;
    }
    .bm-page-img-placeholder svg {
      width: 22px;
      height: 22px;
      opacity: 0.5;
    }
    .bm-page-img-placeholder span {
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-family: 'Segoe UI', sans-serif;
    }
    /* Full-width special page: wider image */
    .bm-page-full .bm-page-img {
      max-width: 500px;
      margin: 0 auto 12px;
      height: 100px;
    }
    .bm-page-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 10px;
      margin-bottom: 4px;
      border: 1px solid rgba(92,45,12,0.12);
      border-radius: 4px;
      cursor: pointer;
      background: rgba(255,255,255,0.6);
      transition: all 0.15s ease;
      gap: 8px;
    }
    .bm-page-item:hover {
      background: #5c2d0c;

      const pad = 20;

      };
    }

      const nudge = 30 + Math.random() * 60;

        rows.forEach((r) => {
          const idx = reservations.indexOf(r);
          const clickable = r.status !== 'completed';
          html += `<div class="bk-resv-row ${r.status}${clickable ? ' clickable' : ''}" data-resv="${idx}">
            <div class="bk-time">${r.time}</div>
            <div>
              <div class="bk-guest">${r.guest}</div>
              ${r.note ? `<div class="bk-note">${r.note}</div>` : ''}
            </div>
          </div>`;
        });
      });
      panel.innerHTML = html;

      panel.querySelectorAll('.bk-resv-row.clickable').forEach(row => {
        row.addEventListener('click', () => {
          const resv = reservations[parseInt(row.dataset.resv)];
          openResvPopup(resv);
        });
      });
    }

    let resvPopup = null;
    let resvSlideIndex = 0;

    function openResvPopup(resv) {
      if (resvPopup) { resvPopup.remove(); resvPopup = null; }

      const popup = document.createElement('div');
      popup.className = 'popup resv-popup';
      popup.style.setProperty('--tilt', '0deg');
      popup.style.visibility = 'hidden';
      popup.style.left = '-9999px';
      popup.style.top = '0';
      resvSlideIndex = 0;

      popup.innerHTML = buildResvPopupHTML(resv, 0);
      document.body.appendChild(popup);

      requestAnimationFrame(() => {
        const w = popup.offsetWidth;
        const h = popup.offsetHeight;
        popup.style.left = Math.round((window.innerWidth - w) / 2) + 'px';
        popup.style.top = Math.round((window.innerHeight - h) / 2) + 'px';
        popup.style.visibility = 'visible';
      });

      bindResvPopupBtns(popup, resv);
      makeDraggable(popup, popup.querySelector('[data-drag]'));
      resvPopup = popup;
    }

    function buildResvPopupHTML(resv, idx) {
      const slide = resv.slides[idx];
      const isLast = idx === resv.slides.length - 1;
      return `
        <div class="popup-titlebar" data-drag style="background:linear-gradient(to right,#111,#2a1f00);border-bottom:1px solid #c8a96e;">
          <div class="popup-title" style="color:#c8a96e;font-family:'Segoe UI',sans-serif;letter-spacing:0.08em;">${resv.guest}</div>
          <div class="popup-controls">
            <button class="popup-btn resv-close-btn" style="background:#2a2a2a;border-color:#555;color:#aaa;">✕</button>
          </div>
        </div>
        <div class="popup-photo" style="background:#111;border-bottom:1px solid #2a2a2a;">
          <div class="popup-photo-placeholder" style="border-color:rgba(200,169,110,0.2);color:rgba(200,169,110,0.3);">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            Add photo
          </div>
        </div>
        <div class="popup-body" style="background:#1a1008;border-top:none;">
          <div class="popup-label" style="color:#c8a96e;">${slide.label}</div>
          <div class="popup-text" style="color:#e8e0d0;">${slide.text}</div>
        </div>
        <div class="popup-footer" style="background:#111;border-top:1px solid #2a2a2a;">
          <span class="popup-counter" style="color:#666;">${idx + 1} of ${resv.slides.length}</span>
          ${!isLast
            ? `<button class="popup-next-btn resv-next-btn" style="color:#c8a96e;">Next →</button>`
            : '<span style="font-size:0.7rem;color:#555;letter-spacing:0.05em;">Done</span>'}
        </div>
      `;
    }

    function bindResvPopupBtns(popup, resv) {
      popup.querySelector('.resv-close-btn').addEventListener('click', () => {
        popup.classList.add('closing');
        popup.addEventListener('animationend', () => { popup.remove(); resvPopup = null; }, { once: true });
      });
      const nextBtn = popup.querySelector('.resv-next-btn');
      if (nextBtn) {
        nextBtn.addEventListener('click', () => {
          resvSlideIndex++;
          popup.innerHTML = buildResvPopupHTML(resv, resvSlideIndex);
          bindResvPopupBtns(popup, resv);
          const handle = popup.querySelector('[data-drag]');
          if (handle) makeDraggable(popup, handle);
        });
      }
    }

    document.getElementById('bk-close-btn').addEventListener('click', () => history.back());

    function openBook() {
      renderBook();
      bookviewEl.style.display = 'flex';
      requestAnimationFrame(() => bookviewEl.classList.add('visible'));
    }

    function closeBook() {
      bookviewEl.classList.remove('visible');
      setTimeout(() => { bookviewEl.style.display = 'none'; }, 300);
    }

    // --- Bar Menu (Lock Stock) ---
    const barmenuEl = document.getElementById('barmenu');

    const barSections = [
      {
        title: 'On Draft', ornament: '— ⬥ —',
        items: [
          { name: 'Service Flow Management', desc: 'All shifts, all dayparts', detail: 'Lunch · Dinner · Late Night', slides: [
            { label: 'The Skill', text: 'Maintained the flow of service across high-volume lunch, dinner, and late-night shifts — keeping tables moving, servers supported, and guests satisfied through every period.' },
            { label: 'In Practice', text: 'No two shifts ran the same. I read the room constantly — adjusting pacing when the kitchen backed up, redistributing floor coverage when a section got slammed, and stepping in wherever the service chain needed support.' },
            { label: 'The Standard', text: 'Standards didn\'t slip when it got busy. That was the whole point. Anyone can run a smooth slow night — the job is keeping quality consistent when it\'s full and loud and moving fast.' }
          ]},
          { name: 'Real-Time Floor Oversight', desc: 'Open to close, every shift', detail: 'FOH · BOH · Bar', slides: [
            { label: 'The Skill', text: 'Active floor presence throughout every shift — not managing from a distance, but working the room alongside the team to catch problems before guests noticed them.' },
            { label: 'In Practice', text: 'I was the constant in an always-changing room. If a table waited too long, I knew before they flagged someone. If a server was in the weeds, I was already there. The floor ran better because I was on it.' },
            { label: 'The Standard', text: 'Good floor management is invisible. When it\'s working, guests just have a great experience — they never see the coordination that made it happen.' }
          ]},
          { name: 'Guest Relations & Recovery', desc: 'Every table, every night', detail: 'Front-line · Escalations', slides: [
            { label: 'The Skill', text: 'Handled all guest issues directly — from minor service hiccups to full escalations — with composure and a bias toward resolution over explanation.' },
            { label: 'In Practice', text: 'At a high-volume bar, something goes wrong every shift. The question is how fast you own it and fix it. I made the call on the floor, handled it personally, and followed up before the guest left.' },
            { label: 'The Standard', text: 'A guest who had a problem and got it handled right is often more loyal than one who never had an issue. Recovery done well builds trust.' }
          ]}
        ]
      },
      {
        title: 'Cocktails', ornament: '— ⬥ —',
        items: [
          { name: 'Staff Cross-Training', desc: 'Full FOH coverage', detail: 'All Roles', slides: [
            { label: 'The Skill', text: 'Trained staff across every FOH role — host, server, barback, bar — so the team could flex to cover gaps without service dropping.' },
            { label: 'In Practice', text: 'A team that only knows one role is fragile. I cross-trained everyone so a no-call-no-show didn\'t break the shift. Adaptability was built into the team by design.' },
            { label: 'The Standard', text: 'The best shifts were the ones where nobody noticed we were short — because the team knew how to cover each other without being asked.' }
          ]},
          { name: 'Performance Coaching', desc: 'Ongoing feedback culture', detail: 'In-shift · Formal Reviews', slides: [
            { label: 'The Skill', text: 'Provided real-time coaching during shifts and contributed to formal performance reviews — keeping the team growing throughout the season.' },
            { label: 'In Practice', text: 'Feedback that waits for review season is too late. I gave it in the moment — a quick word after a table, a debrief at the end of a shift. Small corrections compounded into real improvement.' },
            { label: 'The Standard', text: 'A staff that gets honest, consistent feedback performs better and stays longer. The team knew where they stood — and that I was invested in where they were going.' }
          ]},
          { name: 'Scheduling & Staffing', desc: 'Weekly floor planning', detail: 'Availability · Coverage · Costs', slides: [
            { label: 'The Skill', text: 'Built the weekly schedule balancing staff availability, projected covers, and labor cost targets — keeping the floor covered without overstaffing slow periods.' },
            { label: 'In Practice', text: 'Good scheduling is risk management. I tracked patterns — which nights ran long, which sections needed double coverage, when to cut early. The schedule was a live document, not a formality.' },
            { label: 'The Standard', text: 'The floor was always appropriately staffed. Staff got consistent hours. Labor costs stayed in line. That\'s what a schedule is supposed to do.' }
          ]}
        ]
      },
      {
        title: 'Spirits', ornament: '— ⬥ —',
        items: [
          { name: 'Financial Reporting', desc: 'Nightly close, every shift', detail: 'Cash · Reconciliation · Reports', slides: [
            { label: 'The Skill', text: 'Completed end-of-night financial reports as part of every closing — reconciling cash drawers, accounting for comps and voids, and submitting accurate close documentation.' },
            { label: 'In Practice', text: 'Closing wasn\'t done until the numbers were right. I ran the reconciliation, flagged discrepancies, and filed the report before leaving — no exceptions, regardless of what time it was.' },
            { label: 'The Standard', text: 'Clean books every night. Management had accurate data every morning because closing was treated as seriously as service.' }
          ]},
          { name: 'Health & Safety Compliance', desc: 'Dept. of Health standards', detail: 'Nightly Walk-Through', slides: [
            { label: 'The Skill', text: 'Conducted compliance walk-throughs as part of every close — checking food storage, temperature logs, sanitation stations, and any flagged items from the previous inspection.' },
            { label: 'In Practice', text: 'Compliance isn\'t a once-a-year event before the inspector shows up. I built it into the close routine so the kitchen and bar stayed inspection-ready at all times.' },
            { label: 'The Standard', text: 'No violations. No surprises. A clean inspection is the result of consistent nightly habits — not a scramble the day the inspector walks in.' }
          ]},
          { name: 'Facilities Coordination', desc: 'Maintenance & vendor liaison', detail: 'As Needed', slides: [
            { label: 'The Skill', text: 'Identified and coordinated facilities issues — logging maintenance needs, communicating with vendors, and ensuring repairs happened without disrupting service.' },
            { label: 'In Practice', text: 'Things break in a bar. The job is knowing what can wait until tomorrow and what needs a call tonight. I managed the triage and made sure nothing fell through the cracks.' },
            { label: 'The Standard', text: 'The space stayed operational. Issues got resolved. Staff didn\'t have to work around broken equipment because it was tracked and actioned before it became a real problem.' }
          ]}
        ]
      },
      {
        title: "Tonight's Special", ornament: '— ✦ —', special: true,
        items: [
          { name: 'COVID-19 Operations Pivot', desc: 'Spring 2020 — Full team retrain & SOP overhaul', detail: 'Crisis Management', slides: [
            { label: 'The Situation', text: 'When Lock Stock reopened after COVID-19 closures, the entire operating model had changed. Distancing rules, sanitation requirements, and capacity limits meant the old playbook was gone.' },
            { label: 'The Work', text: 'I rewrote the SOPs, retrained the full FOH team on every new protocol, and managed the reopening rollout through multiple phases as restrictions evolved. The team went from zero to operational in two weeks.' },
            { label: 'The Result', text: 'Service quality held through every reopening phase. The team adapted without complaint because the expectation and the training were both clear from day one. We didn\'t just reopen — we ran well.' }
          ]}
        ]
      }
    ];

    let bmPopup = null;
    let bmSlideIndex = 0;
    let bmCurrentPage = 0;

    // Spreads: 0 = cover, 1 = On Draft + Cocktails, 2 = Spirits + Special, 3-4 = collages
    const bmSpreads = [
      { type: 'cover' },
      { type: 'pages', left: barSections[0], right: barSections[1] },
      { type: 'pages', left: barSections[2], right: barSections[3] },
      { type: 'collage', title: 'Gallery I',  photos: Array(6).fill(null) },
      { type: 'collage', title: 'Gallery II', photos: Array(6).fill(null) }
    ];

    function renderSpread(idx, direction) {
      const spreadEl = document.getElementById('bm-spread');
      const spread = bmSpreads[idx];

      // 3D page flip — fold out current, swap, fold in next
      const outClass = direction === 'next' ? 'fold-out-next' : 'fold-out-prev';
      const inClass  = direction === 'next' ? 'fold-in-next'  : 'fold-in-prev';
      spreadEl.classList.add(outClass);

      setTimeout(() => {
        spreadEl.innerHTML = buildSpreadHTML(spread);
        spreadEl.classList.remove(outClass);
        spreadEl.classList.add(inClass);
        spreadEl.addEventListener('animationend', () => spreadEl.classList.remove(inClass), { once: true });
        bindSpreadItems(spreadEl);
        updateNav(idx);
      }, 220);
    }

    const imgPlaceholder = `<div class="bm-page-img-placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span>Add photo</span>
    </div>`;

    function buildImgSlot(url) {
      return `<div class="bm-page-img">${url ? `<img src="${url}" alt="">` : imgPlaceholder}</div>`;
    }

    function buildSpreadHTML(spread) {
      if (spread.type === 'collage') {
        const slots = spread.photos.map((url, i) => `
          <div class="bm-collage-slot" data-idx="${i}">
            ${url
              ? `<img src="${url}" alt="photo ${i+1}">`
              : `<div class="bm-collage-ph">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                  </svg>
                </div>`
            }
          </div>`).join('');
        return `<div class="bm-collage-page">
          <div class="bm-collage-header">
            <div class="bm-page-title" style="margin-bottom:0">${spread.title}</div>
            <div class="bm-page-orn" style="margin-bottom:0">— ✦ —</div>
          </div>
          <div class="bm-collage-grid">${slots}</div>
        </div>`;
      }
      if (spread.type === 'cover') {
        return `<div class="bm-cover">
          <div class="bm-cover-name">Lock Stock<br>Bar &amp; Grill</div>
          <div class="bm-cover-rule"></div>
          <div class="bm-cover-sub">Bristol, New York &nbsp;·&nbsp; Est. 2019</div>
          <div class="bm-cover-sub" style="margin-top:4px">Floor &amp; Closing Manager</div>
          <div class="bm-cover-tag">Skills &amp; Experience</div>
          <div class="bm-cover-tap">Open menu ›</div>
        </div>`;
      }
      const pages = [spread.left, spread.right];
      return pages.map((sec, pi) => {
        if (sec.special) {
          return `<div class="bm-page-full">
            <div class="bm-page-title">${sec.title}</div>
            <div class="bm-page-orn">${sec.ornament}</div>
            ${buildImgSlot(sec.img)}
            ${sec.items.map((item, i) => `
              <div class="bm-page-item" data-sec="${sec.title}" data-item="${i}">
                <div class="bm-page-item-left">
                  <span class="bm-page-item-name">${item.name}</span>
                  <div class="bm-page-item-sub">${item.desc}</div>
                </div>
                <span class="bm-page-item-arrow">›</span>
              </div>`).join('')}
          </div>`;
        }
        return `<div class="bm-page">
          <div class="bm-page-title">${sec.title}</div>
          <div class="bm-page-orn">${sec.ornament}</div>
          ${buildImgSlot(sec.img)}
          ${sec.items.map((item, i) => `
            <div class="bm-page-item" data-sec="${sec.title}" data-item="${i}">
              <div class="bm-page-item-left">
                <span class="bm-page-item-name">${item.name}</span>
                <div class="bm-page-item-sub">${item.desc}</div>
              </div>
              <span class="bm-page-item-arrow">›</span>
            </div>`).join('')}
        </div>`;
      }).join('');
    }

    function bindSpreadItems(spreadEl) {
      spreadEl.querySelectorAll('.bm-page-item').forEach(el => {
        el.addEventListener('click', () => {
          const sec = barSections.find(s => s.title === el.dataset.sec);
          if (sec) openBmPopup(sec.items[parseInt(el.dataset.item)]);
        });
      });
      // Cover: click to advance
      const cover = spreadEl.querySelector('.bm-cover');
      if (cover) cover.addEventListener('click', () => {
        if (bmCurrentPage < bmSpreads.length - 1) {
          bmCurrentPage++;
          renderSpread(bmCurrentPage, 'next');
        }
      });
    }

    function updateNav(idx) {
      document.getElementById('bm-prev').disabled = idx === 0;
      document.getElementById('bm-next').disabled = idx === bmSpreads.length - 1;
      const labels = ['Cover', 'On Draft & Cocktails', 'Spirits & Specials', 'Gallery I', 'Gallery II'];
      document.getElementById('bm-page-label').textContent = labels[idx];
      document.getElementById('bm-dots').innerHTML = bmSpreads
        .map((_, i) => `<div class="bm-dot${i === idx ? ' active' : ''}"></div>`)
        .join('');
    }

    document.getElementById('bm-prev').addEventListener('click', () => {
      if (bmCurrentPage > 0) { bmCurrentPage--; renderSpread(bmCurrentPage, 'prev'); }
    });
    document.getElementById('bm-next').addEventListener('click', () => {
      if (bmCurrentPage < bmSpreads.length - 1) { bmCurrentPage++; renderSpread(bmCurrentPage, 'next'); }
    });

    function openBmPopup(item) {
      if (bmPopup) { bmPopup.remove(); bmPopup = null; }
      bmSlideIndex = 0;
      const popup = document.createElement('div');
      popup.className = 'popup bm-popup';
      popup.style.setProperty('--tilt', '0deg');
      popup.style.visibility = 'hidden';
      popup.style.left = '-9999px';
      popup.style.top = '0';
      popup.innerHTML = buildBmPopupHTML(item, 0);
      document.body.appendChild(popup);
      requestAnimationFrame(() => {
        const w = popup.offsetWidth, h = popup.offsetHeight;
        popup.style.left = Math.round((window.innerWidth - w) / 2) + 'px';
        popup.style.top = Math.round((window.innerHeight - h) / 2) + 'px';
        popup.style.visibility = 'visible';
      });
      bindBmPopupBtns(popup, item);
      makeDraggable(popup, popup.querySelector('[data-drag]'));
      bmPopup = popup;
    }

    function buildBmPopupHTML(item, idx) {
      const slide = item.slides[idx];
      const isLast = idx === item.slides.length - 1;
      return `
        <div class="popup-titlebar" data-drag style="background:#0d0a07;border-bottom:1px solid #3a2a15;">
          <div class="popup-title" style="color:#c8a96e;font-family:Georgia,serif;letter-spacing:0.06em;">${item.name}</div>
          <div class="popup-controls">
            <button class="popup-btn bm-close-btn" style="background:#1a1005;border-color:#3a2a15;color:#6a5a3a;">✕</button>
          </div>
        </div>
        <div class="popup-photo" style="background:#0a0805;border-bottom:1px solid #1e160a;">
          <div class="popup-photo-placeholder" style="border-color:rgba(200,169,110,0.15);color:rgba(200,169,110,0.25);font-family:'Segoe UI',sans-serif;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            Add photo
          </div>
        </div>
        <div class="popup-body" style="background:#110d08;border-top:none;">
          <div class="popup-label" style="color:#5a4a2a;font-family:'Segoe UI',sans-serif;">${slide.label}</div>
          <div class="popup-text" style="color:#c8b88a;font-family:Georgia,serif;line-height:1.7;">${slide.text}</div>
        </div>
        <div class="popup-footer" style="background:#0d0a07;border-top:1px solid #1e160a;">
          <span class="popup-counter" style="color:#3a2a15;font-family:'Segoe UI',sans-serif;">${idx + 1} of ${item.slides.length}</span>
          ${!isLast
            ? `<button class="popup-next-btn bm-next-btn" style="color:#c8a96e;font-family:'Segoe UI',sans-serif;text-decoration:none;border:1px solid #3a2a15;padding:3px 12px;border-radius:3px;background:none;cursor:pointer;">Next →</button>`
            : '<span style="font-size:0.7rem;color:#3a2a15;font-family:\'Segoe UI\',sans-serif;letter-spacing:0.1em;">— fin —</span>'}
        </div>`;
    }

    function bindBmPopupBtns(popup, item) {
      popup.querySelector('.bm-close-btn').addEventListener('click', () => {
        popup.classList.add('closing');
        popup.addEventListener('animationend', () => { popup.remove(); bmPopup = null; }, { once: true });
      });
      const nextBtn = popup.querySelector('.bm-next-btn');
      if (nextBtn) nextBtn.addEventListener('click', () => {
        bmSlideIndex++;
        popup.innerHTML = buildBmPopupHTML(item, bmSlideIndex);
        bindBmPopupBtns(popup, item);
        makeDraggable(popup, popup.querySelector('[data-drag]'));
      });
    }

    document.getElementById('bm-back-btn').addEventListener('click', () => history.back());

    function openBarMenu() {
      bmCurrentPage = 0;
      const spreadEl = document.getElementById('bm-spread');
      spreadEl.innerHTML = buildSpreadHTML(bmSpreads[0]);
      bindSpreadItems(spreadEl);
      updateNav(0);
      barmenuEl.style.display = 'flex';
      requestAnimationFrame(() => barmenuEl.classList.add('visible'));
    }

    function closeBarMenu() {
      if (bmPopup) { bmPopup.remove(); bmPopup = null; }
      barmenuEl.classList.remove('visible');
      setTimeout(() => { barmenuEl.style.display = 'none'; }, 300);
    }

    // --- Client-side routing ---
    const roleToSlug = { marketing: 'kepler', digital: 'nbi', maitre: 'happier', manager: 'lockstock' };
    const slugToRole = { kepler: 'marketing', nbi: 'digital', happier: 'maitre', lockstock: 'manager' };

    function openPage(roleKey) {
      if (roleKey === 'marketing') {
        if (currentPopup) { currentPopup.remove(); currentPopup = null; }
        tiltIndex = 0;
        openKeplerSlide(0);
      } else if (roleKey === 'digital') {
        openGmail();
      } else if (roleKey === 'maitre') {
        openBook();
      } else if (roleKey === 'manager') {
        openBarMenu();
      }
    }

    function closeCurrent() {
      if (currentPopup) { dismissPopup(currentPopup, currentSlideIndex, false); return; }
      if (detail.classList.contains('visible')) {
        detail.classList.remove('visible');
        setTimeout(() => { detail.style.display = 'none'; }, 400);
        return;
      }
      if (gmailEl.classList.contains('visible'))    { closeGmail();    return; }
      if (bookviewEl.classList.contains('visible')) { closeBook();     return; }
      if (barmenuEl.classList.contains('visible'))  { closeBarMenu();  return; }
    }

    function isAnyViewOpen() {
      return currentPopup ||
        detail.classList.contains('visible') ||
        gmailEl.classList.contains('visible') ||
        bookviewEl.classList.contains('visible') ||
        barmenuEl.classList.contains('visible');
    }

    // Tile clicks push URL + open view
    document.querySelectorAll('.tile').forEach(tile => {
      tile.addEventListener('click', () => {
        const roleKey = tile.dataset.role;
        const slug = roleToSlug[roleKey] || roleKey;
        history.pushState({ page: roleKey }, '', '/' + slug);
        openPage(roleKey);
      });
    });

    // Overlay click closes Kepler via back
    overlay.addEventListener('click', e => {
      if (e.target === overlay && currentPopup) history.back();
    });

    // Escape → back only when a view is open
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && isAnyViewOpen()) history.back();
    });

    // Back button → close current view
    window.addEventListener('popstate', () => closeCurrent());

    // Set base history state
    history.replaceState({ page: 'home' }, '', window.location.pathname || '/');

    // Direct URL load (e.g. luciuscampany.com/nbi)
    const initSlug = window.location.pathname.replace(/^\//, '').toLowerCase();
    if (initSlug && slugToRole[initSlug]) openPage(slugToRole[initSlug]);
  </script>
</body>
