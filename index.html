<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* --- GRID --- */
    #grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      height: 100vh;
      transition: opacity 0.3s ease;
    }

    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: filter 0.3s ease;
    }

    .tile:hover { filter: brightness(1.12); }

    .tile:nth-child(1) { background: #1a1a2e; }
    .tile:nth-child(2) { background: #16213e; }
    .tile:nth-child(3) { background: #0f3460; }
    .tile:nth-child(4) { background: #533483; }

    .tile-label {
      color: #fff;
      font-size: clamp(1.4rem, 3vw, 2.4rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      padding: 1rem;
      border-bottom: 2px solid rgba(255,255,255,0.25);
      padding-bottom: 0.5rem;
      transition: letter-spacing 0.3s ease;
    }

    .tile:hover .tile-label { letter-spacing: 0.2em; }

    .tile-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .tile-inner {
      text-align: center;
    }

    /* --- DETAIL PANEL --- */
    #detail {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.4s ease;
      overflow-y: auto;
    }

    #detail.visible {
      display: flex;
      opacity: 1;
    }

    .detail-header {
      padding: 3rem 4rem 2rem;
      color: #fff;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .detail-title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #close-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.6rem 1.4rem;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.2s;
    }

    #close-btn:hover { background: rgba(255,255,255,0.3); }

    .detail-body {
      background: #f9f9f9;
      flex: 1;
      padding: 3rem 4rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
    }

    @media (max-width: 700px) {
      .detail-body { grid-template-columns: 1fr; padding: 2rem; }
      .detail-header { padding: 2rem; }
    }

    .detail-section h3 {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #ddd;
    }

    .detail-section p,
    .detail-section li {
      font-size: 0.95rem;
      color: #333;
      line-height: 1.7;
    }

    .detail-section ul {
      list-style: none;
      padding: 0;
    }

    .detail-section ul li::before {
      content: "— ";
      color: #aaa;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tag {
      font-size: 0.8rem;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      background: #e8e8e8;
      color: #444;
    }
  </style>
</head>
<body>

  <!-- HOME GRID -->
  <div id="grid">
    <div class="tile" data-role="maitre">
      <div class="tile-inner">
        <div class="tile-icon">🍽️</div>
        <div class="tile-label">Maitre' D</div>
      </div>
    </div>
    <div class="tile" data-role="manager">
      <div class="tile-inner">
        <div class="tile-icon">📋</div>
        <div class="tile-label">Manager</div>
      </div>
    </div>
    <div class="tile" data-role="marketing">
      <div class="tile-inner">
        <div class="tile-icon">📊</div>
        <div class="tile-label">Marketing Analyst</div>
      </div>
    </div>
    <div class="tile" data-role="digital">
      <div class="tile-inner">
        <div class="tile-icon">💡</div>
        <div class="tile-label">Digital Strategist</div>
      </div>
    </div>
  </div>

  <!-- DETAIL PANEL -->
  <div id="detail">
    <div class="detail-header" id="detail-header">
      <div class="detail-title" id="detail-title"></div>
      <button id="close-btn">← Back</button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </div>

  <script>
    const roles = {
      maitre: {
        title: "Maitre' D",
        color: "#1a1a2e",
        sections: [
          {
            heading: "Overview",
            content: `<p>Experienced front-of-house leader with a passion for delivering exceptional dining experiences. Skilled in managing reservations, guest relations, and service flow in high-volume environments.</p>`
          },
          {
            heading: "Responsibilities",
            content: `<ul>
              <li>Greeted and seated guests, managing reservations and wait lists</li>
              <li>Coordinated service staff to ensure seamless dining experiences</li>
              <li>Resolved guest concerns with professionalism and discretion</li>
              <li>Maintained floor standards and ambiance</li>
            </ul>`
          },
          {
            heading: "Key Achievements",
            content: `<ul>
              <li>Consistently received top guest satisfaction scores</li>
              <li>Trained new hosts and service staff</li>
              <li>Introduced reservation optimization that reduced wait times by 20%</li>
            </ul>`
          },
          {
            heading: "Skills",
            content: `<div class="tag-list">
              <span class="tag">Guest Relations</span>
              <span class="tag">Reservation Management</span>
              <span class="tag">Team Coordination</span>
              <span class="tag">Problem Solving</span>
              <span class="tag">Fine Dining</span>
            </div>`
          }
        ]
      },
      manager: {
        title: "Manager",
        color: "#16213e",
        sections: [
          {
            heading: "Overview",
            content: `<p>Results-driven manager with experience leading teams across hospitality and service industries. Focused on operational efficiency, staff development, and delivering measurable results.</p>`
          },
          {
            heading: "Responsibilities",
            content: `<ul>
              <li>Oversaw daily operations and staff scheduling</li>
              <li>Managed budgets, inventory, and vendor relationships</li>
              <li>Set performance goals and conducted staff reviews</li>
              <li>Ensured compliance with health, safety, and company standards</li>
            </ul>`
          },
          {
            heading: "Key Achievements",
            content: `<ul>
              <li>Reduced operational costs by 15% through process improvements</li>
              <li>Built and retained high-performing teams</li>
              <li>Improved staff satisfaction scores year over year</li>
            </ul>`
          },
          {
            heading: "Skills",
            content: `<div class="tag-list">
              <span class="tag">Leadership</span>
              <span class="tag">Operations</span>
              <span class="tag">Budget Management</span>
              <span class="tag">Staff Development</span>
              <span class="tag">Conflict Resolution</span>
            </div>`
          }
        ]
      },
      marketing: {
        title: "Marketing Analyst",
        color: "#0f3460",
        sections: [
          {
            heading: "Overview",
            content: `<p>Data-driven marketing analyst with expertise in campaign performance, consumer behavior, and market research. Translates insights into actionable strategies that drive growth.</p>`
          },
          {
            heading: "Responsibilities",
            content: `<ul>
              <li>Analyzed campaign data to measure ROI and optimize spend</li>
              <li>Conducted competitive and market research</li>
              <li>Built dashboards and reports for stakeholder presentations</li>
              <li>Collaborated with creative and sales teams on go-to-market plans</li>
            </ul>`
          },
          {
            heading: "Key Achievements",
            content: `<ul>
              <li>Identified audience segment that increased conversion by 30%</li>
              <li>Automated reporting, saving 5+ hours per week</li>
              <li>Contributed to campaigns that exceeded quarterly targets</li>
            </ul>`
          },
          {
            heading: "Skills",
            content: `<div class="tag-list">
              <span class="tag">Data Analysis</span>
              <span class="tag">Google Analytics</span>
              <span class="tag">Market Research</span>
              <span class="tag">Excel / Sheets</span>
              <span class="tag">Campaign Reporting</span>
              <span class="tag">A/B Testing</span>
            </div>`
          }
        ]
      },
      digital: {
        title: "Digital Strategist",
        color: "#533483",
        sections: [
          {
            heading: "Overview",
            content: `<p>Creative and analytical digital strategist with a track record of building online presence, growing audiences, and aligning digital initiatives with business objectives.</p>`
          },
          {
            heading: "Responsibilities",
            content: `<ul>
              <li>Developed and executed multi-channel digital strategies</li>
              <li>Managed social media, SEO, email, and paid media programs</li>
              <li>Aligned digital initiatives with brand and business goals</li>
              <li>Monitored KPIs and adjusted strategies based on performance</li>
            </ul>`
          },
          {
            heading: "Key Achievements",
            content: `<ul>
              <li>Grew organic traffic by 45% within 6 months</li>
              <li>Launched social campaigns that doubled engagement rate</li>
              <li>Developed content calendar adopted across the organization</li>
            </ul>`
          },
          {
            heading: "Skills",
            content: `<div class="tag-list">
              <span class="tag">SEO / SEM</span>
              <span class="tag">Social Media Strategy</span>
              <span class="tag">Content Planning</span>
              <span class="tag">Email Marketing</span>
              <span class="tag">Paid Ads</span>
              <span class="tag">Analytics</span>
            </div>`
          }
        ]
      }
    };

    const grid = document.getElementById('grid');
    const detail = document.getElementById('detail');
    const detailHeader = document.getElementById('detail-header');
    const detailTitle = document.getElementById('detail-title');
    const detailBody = document.getElementById('detail-body');
    const closeBtn = document.getElementById('close-btn');

    document.querySelectorAll('.tile').forEach(tile => {
      tile.addEventListener('click', () => {
        const role = roles[tile.dataset.role];
        detailTitle.textContent = role.title;
        detailHeader.style.background = role.color;
        detailBody.innerHTML = role.sections.map(s => `
          <div class="detail-section">
            <h3>${s.heading}</h3>
            ${s.content}
          </div>
        `).join('');

        detail.style.display = 'flex';
        requestAnimationFrame(() => detail.classList.add('visible'));
      });
    });

    closeBtn.addEventListener('click', () => {
      detail.classList.remove('visible');
      setTimeout(() => { detail.style.display = 'none'; }, 400);
    });
  </script>
</body>
</html>
