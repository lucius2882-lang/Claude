<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* --- GRID --- */
    #grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      height: 100vh;
      transition: opacity 0.3s ease;
    }

    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: filter 0.3s ease;
    }

    .tile:hover { filter: brightness(1.12); }

    .tile:nth-child(1) { background: #1a1a2e; }
    .tile:nth-child(2) { background: #16213e; }
    .tile:nth-child(3) { background: #0f3460; }
    .tile:nth-child(4) { background: #533483; }

    .tile-label {
      color: #fff;
      font-size: clamp(1.4rem, 3vw, 2.4rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      padding: 1rem;
      border-bottom: 2px solid rgba(255,255,255,0.25);
      padding-bottom: 0.5rem;
      transition: letter-spacing 0.3s ease;
    }

    .tile:hover .tile-label { letter-spacing: 0.2em; }

    .tile-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .tile-inner {
      text-align: center;
    }

    /* --- DETAIL PANEL --- */
    #detail {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.4s ease;
      overflow-y: auto;
    }

    #detail.visible {
      display: flex;
      opacity: 1;
    }

    .detail-header {
      padding: 3rem 4rem 2rem;
      color: #fff;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .detail-title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #close-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.6rem 1.4rem;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.2s;
    }

    #close-btn:hover { background: rgba(255,255,255,0.3); }

    .detail-body {
      background: #f9f9f9;
      flex: 1;
      padding: 3rem 4rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
    }

    @media (max-width: 700px) {
      .detail-body { grid-template-columns: 1fr; padding: 2rem; }
      .detail-header { padding: 2rem; }
    }

    .detail-section h3 {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #ddd;
    }

    .detail-section p,
    .detail-section li {
      font-size: 0.95rem;
      color: #333;
      line-height: 1.7;
    }

    .detail-section ul {
      list-style: none;
      padding: 0;
    }

    .detail-section ul li::before {
      content: "— ";
      color: #aaa;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tag {
      font-size: 0.8rem;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      background: #e8e8e8;
      color: #444;
    }
  </style>
</head>
<body>

  <!-- HOME GRID -->
  <div id="grid">
    <div class="tile" data-role="maitre">
      <div class="tile-inner">
        <div class="tile-icon">🍽️</div>
        <div class="tile-label">Maître D' & Events Producer</div>
      </div>
    </div>
    <div class="tile" data-role="manager">
      <div class="tile-inner">
        <div class="tile-icon">📋</div>
        <div class="tile-label">Floor & Closing Manager</div>
      </div>
    </div>
    <div class="tile" data-role="marketing">
      <div class="tile-inner">
        <div class="tile-icon">📊</div>
        <div class="tile-label">Digital Marketing Analyst</div>
      </div>
    </div>
    <div class="tile" data-role="digital">
      <div class="tile-inner">
        <div class="tile-icon">💡</div>
        <div class="tile-label">Digital Strategist</div>
      </div>
    </div>
  </div>

  <!-- DETAIL PANEL -->
  <div id="detail">
    <div class="detail-header" id="detail-header">
      <div class="detail-title" id="detail-title"></div>
      <button id="close-btn">← Back</button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </div>

  <script>
    const roles = {
      maitre: {
        title: "Maître D' & Events Producer",
        color: "#1a1a2e",
        sections: [
          {
            heading: "Happier New York / Scott Avenue Association · New York, NY · Jun 2023 – Oct 2024",
            content: `<p>Hands-on FOH leader and events producer across multiple properties. Proficient in Resy, OpenTable, and Toast POS.</p>`
          },
          {
            heading: "Responsibilities",
            content: `<ul>
              <li>Led FOH team of 5 as an active, hands-on manager throughout service — working directly alongside staff from opening through close to uphold service standards, product quality, and a seamless guest experience</li>
              <li>Cultivated guest relationships to drive return business — serving as the primary point of contact for members and repeat guests, and resolving escalated concerns promptly and professionally</li>
              <li>Managed daily reservations and provided active support at the host stand throughout each shift, overseeing seating flow and adjusting assignments in real time to maintain service pacing</li>
              <li>Executed training programs for FOH team members and conducted ongoing feedback to support staff development, reinforce performance expectations, and contribute to regular performance reviews</li>
              <li>Managed private event inquiries and day-of execution across multiple properties, collaborating cross-functionally with HR, Facilities, and Communications to ensure operational alignment</li>
            </ul>`
          },
          {
            heading: "Skills",
            content: `<div class="tag-list">
              <span class="tag">FOH Team Management</span>
              <span class="tag">Guest Recovery</span>
              <span class="tag">Reservation Management</span>
              <span class="tag">Staff Training & Development</span>
              <span class="tag">Private Event Execution</span>
              <span class="tag">Resy</span>
              <span class="tag">OpenTable</span>
              <span class="tag">Toast POS</span>
            </div>`
          }
        ]
      },
      manager: {
        title: "Floor & Closing Manager",
        color: "#16213e",
        sections: [
          {
            heading: "Lock Stock Bar & Grill · Bristol, NY · Nov 2019 – Mar 2021",
            content: `<p>High-volume FOH manager responsible for service flow, team development, and all closing operations across lunch, dinner, and late-night shifts.</p>`
          },
          {
            heading: "Responsibilities",
            content: `<ul>
              <li>Maintained proper flow of service across high-volume lunch, dinner, and late-night shifts — upholding service standards, product quality, and cleanliness throughout every service period</li>
              <li>Performed administrative tasks including financial reports, scheduling, facilities maintenance coordination, and Health Department compliance checks as part of routine closing responsibilities</li>
              <li>Supported all guest recovery efforts including immediate service recovery on the floor, response to guest feedback, and de-escalation of conflict with composure and a team-first mindset</li>
              <li>Drove FOH team development by cross-training staff across all roles, providing ongoing coaching, and reinforcing a culture of continuous learning and adaptability under shifting conditions</li>
              <li>Led operational restructuring during COVID-19 — executing rapid SOP updates, retraining the full FOH team, and maintaining service quality throughout all reopening phases</li>
            </ul>`
          },
          {
            heading: "Skills",
            content: `<div class="tag-list">
              <span class="tag">Service Flow Management</span>
              <span class="tag">Closing Operations</span>
              <span class="tag">Financial Reporting</span>
              <span class="tag">Health & Safety Compliance</span>
              <span class="tag">Staff Cross-Training</span>
              <span class="tag">Guest Recovery</span>
              <span class="tag">Scheduling</span>
            </div>`
          }
        ]
      },
      marketing: {
        title: "Digital Marketing Analyst",
        color: "#0f3460",
        sections: [
          {
            heading: "Kepler · New York, NY · Mar 2021 – Apr 2023",
            content: `<p>Data-driven analyst managing $3M+ in client accounts — applying precision, organizational rigor, and calm under pressure to fast-moving, team-dependent campaign work.</p>`
          },
          {
            heading: "Responsibilities",
            content: `<ul>
              <li>Applied exceptional organizational skills and quick, data-driven thinking to managing $3M+ in client accounts</li>
              <li>Demonstrated a positive, growth-oriented approach to accepting feedback and implementing direction in a fast-moving, team-dependent environment</li>
            </ul>`
          },
          {
            heading: "Skills",
            content: `<div class="tag-list">
              <span class="tag">Digital Marketing</span>
              <span class="tag">Client Account Management</span>
              <span class="tag">Data-Driven Analysis</span>
              <span class="tag">Campaign Reporting</span>
              <span class="tag">Organizational Skills</span>
            </div>`
          }
        ]
      },
      digital: {
        title: "Digital Strategist",
        color: "#533483",
        sections: [
          {
            heading: "Overview",
            content: `<p>Creative and analytical digital strategist with a track record of building online presence, growing audiences, and aligning digital initiatives with business objectives.</p>`
          },
          {
            heading: "Responsibilities",
            content: `<ul>
              <li>Developed and executed multi-channel digital strategies</li>
              <li>Managed social media, SEO, email, and paid media programs</li>
              <li>Aligned digital initiatives with brand and business goals</li>
              <li>Monitored KPIs and adjusted strategies based on performance</li>
            </ul>`
          },
          {
            heading: "Key Achievements",
            content: `<ul>
              <li>Grew organic traffic by 45% within 6 months</li>
              <li>Launched social campaigns that doubled engagement rate</li>
              <li>Developed content calendar adopted across the organization</li>
            </ul>`
          },
          {
            heading: "Skills",
            content: `<div class="tag-list">
              <span class="tag">SEO / SEM</span>
              <span class="tag">Social Media Strategy</span>
              <span class="tag">Content Planning</span>
              <span class="tag">Email Marketing</span>
              <span class="tag">Paid Ads</span>
              <span class="tag">Analytics</span>
            </div>`
          }
        ]
      }
    };

    const grid = document.getElementById('grid');
    const detail = document.getElementById('detail');
    const detailHeader = document.getElementById('detail-header');
    const detailTitle = document.getElementById('detail-title');
    const detailBody = document.getElementById('detail-body');
    const closeBtn = document.getElementById('close-btn');

    document.querySelectorAll('.tile').forEach(tile => {
      tile.addEventListener('click', () => {
        const role = roles[tile.dataset.role];
        detailTitle.textContent = role.title;
        detailHeader.style.background = role.color;
        detailBody.innerHTML = role.sections.map(s => `
          <div class="detail-section">
            <h3>${s.heading}</h3>
            ${s.content}
          </div>
        `).join('');

        detail.style.display = 'flex';
        requestAnimationFrame(() => detail.classList.add('visible'));
      });
    });

    closeBtn.addEventListener('click', () => {
      detail.classList.remove('visible');
      setTimeout(() => { detail.style.display = 'none'; }, 400);
    });
  </script>
</body>
</html>
