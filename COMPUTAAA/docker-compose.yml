# Four containers, no open ports, separate networks:
#
#   cloudflared ──edge── control ──internal── worker-main ──egress── the web
#                                       └──── worker-jobs ──egress── job sites
#
#   control      dashboard, passkeys, approvals, Claude agent loops, your job profile. Holds the API key, no logins.
#   worker-main  your Main agent's browser. Holds its logins, no API key.
#   worker-jobs  the Jobs agent's browser: its own profile and sites, completely separate from Main.
#   cloudflared  outbound-only tunnel to Cloudflare, which enforces Cloudflare Access.
services:
  control:
    build: { context: ., dockerfile: Dockerfile.control }
    env_file: .env
    environment:
      HOST: 0.0.0.0
      WORKER_HOST: 0.0.0.0
      DATA_DIR: /data
      # Workers live on this private range; they may use the worker channel, never the dashboard.
      WORKER_SUBNET: 10.250.0.0/24
    volumes:
      # Your passkeys, job profile and logs: on the ENCRYPTED folder (README step 3).
      # Long form with create_host_path: false, so if the encrypted folder isn't unlocked (e.g. after a reboot)
      # the container refuses to start instead of writing to a plain, unencrypted folder.
      - type: bind
        source: /srv/computaaa/data/control
        target: /data
        bind: { create_host_path: false }
    networks: [edge, internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped

  worker-main:
    build: { context: ., dockerfile: Dockerfile.worker }
    # Deliberately NOT env_file: the worker gets only what it needs, never the API key.
    environment:
      WORKER_NAME: main
      WORKER_TOKEN: ${WORKER_TOKEN_MAIN}
      CONTROL_URL: ws://control:3001/worker
      ALLOWED_SITES: ${ALLOWED_SITES}
      EPHEMERAL: ${MAIN_EPHEMERAL:-false}
      PROFILE_DIR: /profile
    volumes:
      # The Main agent's logins: ENCRYPTED folder only.
      # Long form with create_host_path: false, so if the encrypted folder isn't unlocked (e.g. after a reboot)
      # the container refuses to start instead of writing to a plain, unencrypted folder.
      - type: bind
        source: /srv/computaaa/data/worker-main
        target: /profile
        bind: { create_host_path: false }
    networks: [internal, egress]
    read_only: true
    tmpfs: [/tmp, /home/pwuser]
    shm_size: 1gb
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    pids_limit: 512
    restart: unless-stopped

  worker-jobs:
    build: { context: ., dockerfile: Dockerfile.worker }
    environment:
      WORKER_NAME: jobs
      WORKER_TOKEN: ${WORKER_TOKEN_JOBS}
      CONTROL_URL: ws://control:3001/worker
      ALLOWED_SITES: ${JOBS_ALLOWED_SITES}
      EPHEMERAL: ${JOBS_EPHEMERAL:-false}
      PROFILE_DIR: /profile
    volumes:
      # The Jobs agent's logins: ENCRYPTED folder only.
      # Long form with create_host_path: false, so if the encrypted folder isn't unlocked (e.g. after a reboot)
      # the container refuses to start instead of writing to a plain, unencrypted folder.
      - type: bind
        source: /srv/computaaa/data/worker-jobs
        target: /profile
        bind: { create_host_path: false }
    networks: [internal, egress]
    read_only: true
    tmpfs: [/tmp, /home/pwuser]
    shm_size: 1gb
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    pids_limit: 512
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest   # pin to a current release tag once it's running
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on: [control]

networks:
  edge: {}                  # cloudflared <-> control, plus internet for the API and Cloudflare
  internal:                 # control <-> workers only; no internet at all
    internal: true
    ipam: { config: [{ subnet: 10.250.0.0/24 }] }
  egress: {}                # the worker's way out to websites
