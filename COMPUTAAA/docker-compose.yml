# Three containers, no open ports, three separate networks:
#
#   cloudflared ──edge── control ──internal── worker-main ──egress── the web
#
#   control      dashboard, passkeys, approvals, Claude agent loop. Holds the API key, no logins.
#   worker-main  the logged-in browser. Holds your logins, no API key, can't reach cloudflared.
#   cloudflared  outbound-only tunnel to Cloudflare, which enforces Cloudflare Access.
services:
  control:
    build: { context: ., dockerfile: Dockerfile.control }
    env_file: .env
    environment:
      HOST: 0.0.0.0
      WORKER_HOST: 0.0.0.0
      DATA_DIR: /data
    volumes:
      - /srv/computaaa/data/control:/data          # on the ENCRYPTED folder (README step 3)
    networks: [edge, internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped

  worker-main:
    build: { context: ., dockerfile: Dockerfile.worker }
    # Deliberately NOT env_file: the worker gets only what it needs, never the API key.
    environment:
      WORKER_NAME: main
      WORKER_TOKEN: ${WORKER_TOKEN}
      CONTROL_URL: ws://control:3001/worker
      ALLOWED_SITES: ${ALLOWED_SITES}
      PROFILE_DIR: /profile
    volumes:
      - /srv/computaaa/data/worker-main:/profile   # your logins; ENCRYPTED folder only
    networks: [internal, egress]
    read_only: true
    tmpfs: [/tmp, /home/pwuser]
    shm_size: 1gb
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    pids_limit: 512
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest   # pin to a current release tag once it's running
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on: [control]

networks:
  edge: {}                  # cloudflared <-> control, plus internet for the API and Cloudflare
  internal: { internal: true }  # control <-> worker only; no internet at all
  egress: {}                # the worker's way out to websites
